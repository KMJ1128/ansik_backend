spring.application.name=ansik
spring.config.import=optional:file:.env.properties

server.port=8088

# OpenAI restaurant menu research (keep the key in an environment variable)
openai.api-key=${OPENAI_API_KEY:}
openai.model=${OPENAI_MODEL:gpt-5.6-luna}
openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}

# Server request and external API logs
logging.level.root=INFO
logging.level.com.kmj.ansik=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [requestId=%X{requestId:-system}] %logger{40} - %msg%n
logging.file.name=logs/ansik-server.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [requestId=%X{requestId:-system}] %logger{60} - %msg%n
logging.logback.rollingpolicy.max-file-size=20MB
logging.logback.rollingpolicy.max-history=14
logging.logback.rollingpolicy.total-size-cap=300MB


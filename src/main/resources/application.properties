spring.application.name=ansik
spring.config.import=optional:file:.env.properties,optional:file:.auth.properties,optional:file:.providers.properties

server.port=${SERVER_PORT:8088}
server.compression.enabled=true
server.compression.min-response-size=1024
server.tomcat.threads.max=40
server.tomcat.threads.min-spare=4
server.tomcat.accept-count=50
server.tomcat.max-connections=200
server.forward-headers-strategy=native
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Expose only a non-sensitive endpoint for VM health checks.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# Small-server cache and traffic limits
cache.local.max-weight-bytes=${CACHE_LOCAL_MAX_WEIGHT_BYTES:33554432}
cache.cleanup.cron=0 20 4 * * *
traffic.rate-limit.general-per-minute=${GENERAL_RATE_LIMIT_PER_MINUTE:120}
traffic.rate-limit.ai-per-minute=${AI_RATE_LIMIT_PER_MINUTE:8}
traffic.bulkhead.openai=${OPENAI_MAX_CONCURRENT_REQUESTS:2}
traffic.bulkhead.tourapi=${TOURAPI_MAX_CONCURRENT_REQUESTS:8}
traffic.bulkhead.naver=${NAVER_MAX_CONCURRENT_REQUESTS:4}
traffic.bulkhead.wait-ms=${EXTERNAL_API_QUEUE_WAIT_MS:1500}

# Packaged defaults let the deployment JAR run by itself. Environment variables
# still take precedence when credentials are rotated later.
auth.kakao.native-app-key=${KAKAO_LOGIN_NATIVE_APP_KEY:7a4ce9cf18bcb59b25bda5495b554471}
auth.naver.client-id=${NAVER_LOGIN_CLIENT_ID:laMFdswSELhmWtpM0azJ}
auth.naver.client-secret=${NAVER_LOGIN_CLIENT_SECRET:60xqwvxO7k}
auth.jwt.secret-base64=${AUTH_JWT_SECRET_BASE64:MdMKuKpxWP+Fu9afMDFcGeRRXZoI/Z2jBwhnKG7ArNej4Q6kPbYbpb2ZslVLszfi}
auth.jwt.access-token-minutes=${AUTH_ACCESS_TOKEN_MINUTES:30}
auth.jwt.refresh-token-days=${AUTH_REFRESH_TOKEN_DAYS:30}

# OpenAI restaurant menu research (keep the key in an environment variable)
openai.api-key=${OPENAI_API_KEY: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}
openai.model=${OPENAI_MODEL:gpt-5.6-luna}
openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}

# Server request and external API logs
logging.level.root=INFO
logging.level.com.kmj.ansik=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [requestId=%X{requestId:-system}] %logger{40} - %msg%n
logging.file.name=logs/ansik-server.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [requestId=%X{requestId:-system}] %logger{60} - %msg%n
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7
logging.logback.rollingpolicy.total-size-cap=100MB

